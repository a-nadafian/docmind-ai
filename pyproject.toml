[project]
name = "docmind-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.143.0",
    "fastembed>=0.9.0",
    "httpx>=0.28.1",
    "pymupdf>=1.28.2",
    "qdrant-client>=1.19.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
